name: erp-dev
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: erp
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp
    ports:
      # 5433 on the host: 5432 is taken by the HMS dev database.
      - '127.0.0.1:5433:5432'
    volumes:
      - erp-pg:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U erp -d erp']
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  erp-pg:
